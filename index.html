<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yachi University</title>
<link rel="preconnect" href="https://mczhuzxcjrdtfrcswusf.supabase.co" crossorigin>

<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #1d2733; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.1rem; margin-top: 0; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  input, select, button { font-size: 1rem; padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; }
  button.secondary { background: #64748b; }
  button.danger { background: #dc2626; }
  td button { width: auto; padding: 6px 10px; font-size: .85rem; margin: 2px 2px 2px 0; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  .msg { color: #b91c1c; min-height: 1.2em; }
  .ok { color: #15803d; }
  .hidden { display: none; }
  @keyframes yusk { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
  .sk, .yu-sk b { display: inline-block; height: 1em; min-width: 2.2em; border-radius: 4px; vertical-align: middle; background: linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size: 200% 100%; animation: yusk 1.2s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .sk, .yu-sk b { animation: none } }
</style>
</head>
<body>
<script src="splash.js?v=1"></script>
<script src="turnstile.js?v=1793680351278"></script>
<h1>Yachi University – Student Management</h1>

<div id="loginBox" class="card">
  <h2>Sign in</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Sign in</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="appBox" class="hidden">
  <div class="card">
    <span id="who"></span>
    <button id="logoutBtn" class="secondary">Sign out</button>
  </div>

  <form id="studentForm" class="card">
    <h2 id="formTitle">Add student</h2>
    <input id="f_name" placeholder="Full name" required>
    <input id="f_email" type="email" placeholder="Email" required>
    <div id="udpMount"></div>
    <div id="udpSummary" style="display:none;margin:8px 0"></div>
    <select id="f_program" required></select>
    <input id="f_year" type="number" min="1" max="8" placeholder="Year of study" required>
    <div id="extra">
      <input id="f_phone" placeholder="Phone (optional)">
      <input id="f_address" placeholder="Address (optional)">
      <label>Date of birth (needed for ID sign-up)</label>
      <input id="f_dob" type="date">
      <input id="f_admission" placeholder="Grade 12 admission number (optional)" autocapitalize="characters">
      <input id="f_username" placeholder="Academic username (optional)" autocapitalize="none">
    </div>
    <button type="submit" id="saveBtn">Add student</button>
    <button type="button" id="cancelBtn" class="secondary hidden">Cancel edit</button>
    <div id="formMsg" class="msg"></div>
  </form>

  <div class="card">
    <h2>Students</h2>
    <button id="refreshBtn">Refresh list</button>
    <div id="listMsg" class="msg"></div>
    <div class="scroll">
      <table>
        <thead><tr><th>Number</th><th>Name</th><th>Email</th><th>Year</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <form id="enrollForm" class="card">
    <h2>Enroll a student</h2>
    <select id="e_student" required></select>
    <select id="e_course" required></select>
    <select id="e_semester" required></select>
    <button type="submit">Enroll</button>
    <div id="enrollMsg" class="msg"></div>
  </form>

  <div class="card">
    <h2>Class roster</h2>
    <select id="r_course"></select>
    <select id="r_semester"></select>
    <button id="rosterBtn" type="button">Show roster</button>
    <div id="rosterMsg" class="msg"></div>
    <div class="scroll">
      <table>
        <thead><tr><th>Number</th><th>Name</th><th>Status</th><th></th></tr></thead>
        <tbody id="rosterRows"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="core.js?v=1"></script>
<script>
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  let programs = [];
  let editing = null;

  function say(id, text, ok) {
    const el = $(id);
    el.textContent = text;
    el.classList.toggle('ok', !!ok);
  }

  function fill(selectId, items, labelFn) {
    const sel = $(selectId);
    sel.replaceChildren();
    for (const it of items) {
      const o = document.createElement('option');
      o.value = it.id;
      o.textContent = labelFn(it);
      sel.appendChild(o);
    }
  }

  function show(signedIn, user) {
    $('loginBox').classList.toggle('hidden', signedIn);
    $('appBox').classList.toggle('hidden', !signedIn);
    $('who').textContent = signedIn ? 'Signed in as ' + user.email : '';
  }

  /* ---------- lookups ---------- */
  async function loadPrograms() {
    const { data, error } = await db.from('programs').select('id, department_id, code').order('code');
    if (error) { say('formMsg', 'Programs: ' + error.message); return; }
    programs = data;
    fill('f_program', programs, (p) => p.code);
  }

  async function loadCourseAndSemesterLists() {
    // courses and the academic-year -> semesters chain run at the same time
    const coursesP = db.from('courses').select('id, course_code, title').order('course_code');
    const semestersP = db.from('academic_years').select('id').eq('is_current', true).single().then(async (y) => {
      if (y.error) return { stage: 'Academic year', error: y.error };
      const s = await db.from('semesters').select('id, name').eq('academic_year_id', y.data.id).order('name');
      return { stage: 'Semesters', error: s.error, data: s.data };
    });
    const [c, s] = await Promise.all([coursesP, semestersP]);
    if (c.error) { say('enrollMsg', 'Courses: ' + c.error.message); }
    else {
      const label = (x) => x.course_code + ' \u2013 ' + x.title;
      fill('e_course', c.data, label);
      fill('r_course', c.data, label);
    }
    if (s.error) { say('enrollMsg', s.stage + ': ' + s.error.message); return; }
    fill('e_semester', s.data, (x) => x.name);
    fill('r_semester', s.data, (x) => x.name);
  }

  /* ---------- students ---------- */
  function resetForm() {
    editing = null;
    $('studentForm').reset();
    $('formTitle').textContent = 'Add student';
    $('saveBtn').textContent = 'Add student';
    $('cancelBtn').classList.add('hidden');
    /* extra fields stay visible */
    $('f_program').disabled = false;
    if (window.studentFormReset) studentFormReset();
  }

  function startEdit(s) {
    editing = s.student_number;
    $('formTitle').textContent = 'Edit ' + s.student_number;
    $('saveBtn').textContent = 'Save changes';
    $('cancelBtn').classList.remove('hidden');
    $('extra').classList.remove('hidden');
    $('f_name').value = s.full_name || '';
    $('f_email').value = s.email || '';
    $('f_year').value = s.year_of_study ?? '';
    $('f_phone').value = s.phone || '';
    $('f_address').value = s.address || '';
    $('f_dob').value = s.date_of_birth || '';
    $('f_admission').value = s.admission_number || '';
    $('f_username').value = s.academic_username || '';
    $('f_program').disabled = true;
    if (window.studentFormEdit) studentFormEdit(s);
    say('formMsg', '');
    window.scrollTo(0, 0);
  }

  const STUDENT_COLS = 'id, student_number, full_name, email, year_of_study, phone, address, date_of_birth, unit_id, department_id, admission_number, academic_username';
  const PAGE = 100;
  let shown = 0, choicesLoaded = false;
  const moreBtn = document.createElement('button');
  moreBtn.className = 'secondary hidden';
  moreBtn.textContent = 'Load more students';
  $('rows').closest('.scroll').after(moreBtn);
  moreBtn.onclick = () => loadStudents(true);

  function skeletonRows(n) {
    const body = $('rows');
    body.replaceChildren();
    for (let i = 0; i < n; i++) {
      const tr = document.createElement('tr');
      for (let j = 0; j < 5; j++) {
        const td = document.createElement('td');
        const sp = document.createElement('span');
        sp.className = 'sk';
        sp.style.width = j === 1 ? '9em' : j === 2 ? '10em' : '4em';
        td.appendChild(sp);
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
  }

  // the enroll dropdown needs every student, but only 3 columns, and it is not urgent
  async function loadStudentChoices() {
    if (choicesLoaded) return;
    choicesLoaded = true;
    const r = await db.from('students').select('id, student_number, full_name').order('student_number');
    if (r.error) { choicesLoaded = false; say('enrollMsg', 'Students: ' + r.error.message); return; }
    fill('e_student', r.data, (s) => s.student_number + ' \u2013 ' + s.full_name);
  }
  const idle = (fn) => (window.requestIdleCallback ? window.requestIdleCallback(fn, { timeout: 1500 }) : setTimeout(fn, 300));

  async function loadStudents(more) {
    more = more === true;
    say('listMsg', '');
    const from = more ? shown : 0;
    // the table needs only 5 columns; the full record is fetched when Edit is pressed
    const { data, error } = await db
      .from('students')
      .select('id, student_number, full_name, email, year_of_study')
      .order('student_number')
      .range(from, from + PAGE - 1);
    if (error) { say('listMsg', error.message); $('rows').replaceChildren(); return; }
    const body = $('rows');
    if (!more) { body.replaceChildren(); shown = 0; choicesLoaded = false; idle(loadStudentChoices); }
    for (const s of data) {
      const tr = document.createElement('tr');
      for (const v of [s.student_number, s.full_name, s.email, s.year_of_study]) {
        const td = document.createElement('td');
        td.textContent = v ?? '';
        tr.appendChild(td);
      }
      const act = document.createElement('td');
      const eb = document.createElement('button');
      eb.textContent = 'Edit';
      eb.className = 'secondary';
      eb.onclick = async () => {
        eb.disabled = true;
        const r = await db.from('students').select(STUDENT_COLS).eq('id', s.id).single();
        eb.disabled = false;
        if (r.error) { say('listMsg', r.error.message); return; }
        startEdit(r.data);
      };
      const dbtn = document.createElement('button');
      dbtn.textContent = 'Delete';
      dbtn.className = 'danger';
      dbtn.onclick = () => removeStudent(s);
      act.append(eb, dbtn);
      tr.appendChild(act);
      body.appendChild(tr);
    }
    shown = from + data.length;
    moreBtn.classList.toggle('hidden', data.length < PAGE);
    if (shown === 0) say('listMsg', 'No students visible to this account.');
  }

  async function removeStudent(s) {
    if (!confirm('Delete ' + s.student_number + ' (' + s.full_name + ')? This cannot be undone.')) return;
    const { data, error } = await db.from('students').delete().eq('student_number', s.student_number).select();
    if (error) { say('listMsg', error.message); return; }
    if (!data || data.length === 0) { say('listMsg', 'Not deleted: you do not have permission.'); return; }
    say('listMsg', 'Deleted ' + s.student_number, true);
    if (editing === s.student_number) resetForm();
    loadStudents();
  }

  $('studentForm').onsubmit = async (e) => {
    e.preventDefault();
    say('formMsg', '');
    const year = Number($('f_year').value);
    if (editing) {
      const changes = {
        full_name: $('f_name').value.trim(),
        email: $('f_email').value.trim(),
        year_of_study: year,
        phone: $('f_phone').value.trim() || null,
        address: $('f_address').value.trim() || null,
        date_of_birth: $('f_dob').value || null,
        admission_number: ($('f_admission').value.trim() || null),
        academic_username: ($('f_username').value.trim() || null)
      };
      const { data, error } = await db.from('students').update(changes).eq('student_number', editing).select();
      if (error) { say('formMsg', error.message); return; }
      if (!data || data.length === 0) { say('formMsg', 'Not saved: you do not have permission.'); return; }
      say('formMsg', 'Saved ' + editing, true);
      resetForm();
    } else {
      const prog = programs.find((p) => p.id === $('f_program').value);
      if (!window.studentPicker || !studentPicker.validate()) { say('formMsg', 'Choose a college, institute or school, and a department.'); return; }
      const pv = studentPicker.getValue();
      if (!prog) { say('formMsg', 'Pick a program.'); return; }
      if (prog.department_id !== pv.department_id) { say('formMsg', 'The program does not belong to the chosen department.'); return; }
      const { data, error } = await db.from('students').insert({
        full_name: $('f_name').value.trim(),
        email: $('f_email').value.trim(),
        department_id: pv.department_id,
        unit_id: pv.unit_id,
        program_id: prog.id,
        phone: $('f_phone').value.trim() || null,
        address: $('f_address').value.trim() || null,
        date_of_birth: $('f_dob').value || null,
        admission_number: $('f_admission').value.trim() || null,
        academic_username: $('f_username').value.trim() || null,
        year_of_study: year
      }).select('student_number, full_name').single();
      if (error) { say('formMsg', error.message); return; }
      say('formMsg', 'Added ' + data.student_number, true);
      resetForm();
    }
    loadStudents();
  };

  $('cancelBtn').onclick = () => { resetForm(); say('formMsg', ''); };
  $('refreshBtn').onclick = loadStudents;

  /* ---------- enrollments ---------- */
  $('enrollForm').onsubmit = async (e) => {
    e.preventDefault();
    say('enrollMsg', '');
    const { data, error } = await db.from('enrollments').insert({
      student_id: $('e_student').value,
      course_id: $('e_course').value,
      semester_id: $('e_semester').value
    }).select();
    if (error) { say('enrollMsg', error.message); return; }
    say('enrollMsg', 'Enrolled.', true);
    $('r_course').value = $('e_course').value;
    $('r_semester').value = $('e_semester').value;
    loadRoster();
  };

  async function loadRoster() {
    say('rosterMsg', '');
    const { data, error } = await db
      .from('enrollments')
      .select('id, status, students(student_number, full_name)')
      .eq('course_id', $('r_course').value)
      .eq('semester_id', $('r_semester').value);
    if (error) { say('rosterMsg', error.message); return; }
    data.sort((a, b) => (a.students?.student_number || '').localeCompare(b.students?.student_number || ''));
    const body = $('rosterRows');
    body.replaceChildren();
    for (const en of data) {
      const tr = document.createElement('tr');
      for (const v of [en.students?.student_number, en.students?.full_name, en.status]) {
        const td = document.createElement('td');
        td.textContent = v ?? '';
        tr.appendChild(td);
      }
      const act = document.createElement('td');
      const rb = document.createElement('button');
      rb.textContent = 'Remove';
      rb.className = 'danger';
      rb.onclick = () => removeEnrollment(en);
      act.appendChild(rb);
      tr.appendChild(act);
      body.appendChild(tr);
    }
    if (data.length === 0) say('rosterMsg', 'No enrollments for this course and semester.');
  }

  async function removeEnrollment(en) {
    const who = (en.students?.student_number || '') + ' ' + (en.students?.full_name || '');
    if (!confirm('Remove ' + who + ' from this course? Their grades for it may also be affected.')) return;
    const { data, error } = await db.from('enrollments').delete().eq('id', en.id).select();
    if (error) { say('rosterMsg', error.message); return; }
    if (!data || data.length === 0) { say('rosterMsg', 'Not removed: you do not have permission.'); return; }
    say('rosterMsg', 'Removed.', true);
    loadRoster();
  }

  $('rosterBtn').onclick = loadRoster;

  /* ---------- sign in / out ---------- */
  async function startApp() {
    skeletonRows(6);
    // independent loads run together instead of one after another
    await Promise.allSettled([loadPrograms(), loadCourseAndSemesterLists(), loadStudents()]);
  }

  $('loginBtn').onclick = async () => {
    say('loginMsg', '');
    const __ct = await (window.yuCaptcha ? window.yuCaptcha() : Promise.resolve(null)).catch(function () { return null });
    const { data, error } = await db.auth.signInWithPassword({
      options: { captchaToken: __ct || undefined },
      email: $('email').value.trim(),
      password: $('password').value
    });
    $('password').value = '';
    if (error) { say('loginMsg', error.message); return; }
    show(true, data.user);
    startApp();
  };

  $('logoutBtn').onclick = async () => {
    await db.auth.signOut();
    $('rows').replaceChildren();
    $('rosterRows').replaceChildren();
    resetForm();
    for (const id of ['formMsg', 'listMsg', 'enrollMsg', 'rosterMsg']) say(id, '');
    show(false);
  };

  db.auth.getSession().then(({ data }) => {
    if (data.session) {
      show(true, data.session.user);
      startApp();
    }
  });
</script>
