<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement & Internship - Yachi University</title>
<style>

  .shell { max-width:1180px; margin:0 auto; padding:14px; display:grid; grid-template-columns:230px 1fr; gap:16px; align-items:start; }

  main { min-width:0; }

  .pgh h2 { margin:0; font-size:1.25rem; } .muted { color:var(--muted); font-size:.9rem; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:14px; border-top:3px solid var(--brand); }
  .stat b { display:block; font-size:1.7rem; line-height:1.1; } .stat span { color:var(--muted); font-size:.85rem; }
  .stat.p { border-top-color:#d97706; } .stat.p b { color:#d97706; } .stat.g { border-top-color:var(--ok); } .stat.g b { color:var(--ok); } .stat.i b { color:var(--brand); }
  .btn { padding:10px 18px; border:0; border-radius:10px; background:var(--brand); color:var(--brand-text); font:inherit; font-weight:500; cursor:pointer; }
  .btn.alt { background:var(--soft); color:var(--text); } .btn.danger { background:var(--danger); color:#fff; } .btn.ok { background:var(--ok); color:#fff; } .btn.sm { padding:6px 12px; font-size:.88rem; }
  .btn:disabled { opacity:.55; cursor:default; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  label.f { display:block; margin:12px 0 5px; font-weight:500; font-size:.95rem; } label.f .req { color:var(--danger); }
  select, input[type=text], input[type=search], input[type=date], input[type=datetime-local], input[type=number], input[type=email], input[type=url], textarea { width:100%; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  textarea { min-height:90px; resize:vertical; } select:focus, input:focus, textarea:focus { outline:2px solid var(--brand); border-color:transparent; }
  .bad { border-color:var(--danger) !important; } .ferr { color:var(--danger); font-size:.85rem; min-height:1.1em; margin-top:3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px; }
  .chk { display:flex; gap:8px; align-items:center; margin:6px 0; } .chk input { width:20px; height:20px; accent-color:var(--brand); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .chip { font-size:.78rem; padding:3px 10px; border-radius:20px; background:var(--soft); color:var(--text); }
  .bd { font-size:.78rem; padding:3px 10px; border-radius:20px; font-weight:600; color:#fff; white-space:nowrap; background:#64748b; }
  .bd.Pending,.bd.Draft { background:#d97706; } .bd.Approved,.bd.Open,.bd.Placed,.bd.Active,.bd.Completed { background:#15803d; } .bd.Rejected,.bd.Terminated,.bd.Not-Completed,.bd.Inactive { background:#dc2626; }
  .bd.Interview-Scheduled,.bd.Published,.bd.Assigned,.bd.Ongoing,.bd.Scheduled { background:#2563eb; } .bd.Withdrawn,.bd.Closed,.bd.Cancelled { background:#64748b; }
  .tbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; } .tbar > * { flex:1 1 150px; } .tbar .q { flex:2 1 220px; }
  .tw { overflow-x:auto; } table { width:100%; border-collapse:collapse; }
  th { text-align:start; font-size:.8rem; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; } tr.click { cursor:pointer; } tr.click:hover td { background:var(--soft); }
  .pager { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .empty { text-align:center; padding:30px 10px; color:var(--muted); }
  .banner { padding:12px 14px; border-radius:12px; margin-bottom:12px; } .banner.err { background:rgba(220,38,38,.1); color:var(--danger); border:1px solid var(--danger); } .banner.ok { background:rgba(21,128,61,.12); color:var(--ok); border:1px solid var(--ok); }
  .skel { height:70px; border-radius:14px; background:linear-gradient(90deg,var(--card),var(--soft),var(--card)); background-size:200% 100%; animation:sk 1.2s infinite; margin-bottom:10px; } @keyframes sk { to { background-position:-200% 0; } }
  .act { list-style:none; margin:0; padding:0; } .act li { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); } .act li:last-child { border-bottom:0; }
  .act .dot { width:10px; height:10px; border-radius:50%; background:var(--brand); margin-top:6px; flex:none; } .act small { color:var(--muted); display:block; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:4px 12px; font-size:.92rem; margin:8px 0; } .kv b { color:var(--muted); font-weight:500; } .kv span { word-break:break-word; }
  .txt { white-space:pre-wrap; word-break:break-word; margin:4px 0 10px; }
  .box { padding:12px; border-radius:12px; background:var(--soft); margin:10px 0; } .box h4 { margin:0 0 6px; font-size:.95rem; }
  .docrow { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; } .docrow:last-child { border-bottom:0; }
  .bar { height:10px; border-radius:6px; background:var(--soft); overflow:hidden; min-width:60px; } .bar i { display:block; height:100%; background:var(--brand); }
  .ov { position:fixed; inset:0; background:rgba(5,12,30,.6); z-index:30; display:flex; align-items:flex-end; justify-content:center; }
  .dlg { background:var(--card); width:100%; max-width:720px; max-height:94vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px; }
  .dlg.sm { max-width:440px; } .dlg .hd { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:6px; }
  .dlg .hd h2 { margin:0; font-size:1.15rem; word-break:break-word; } .dlg .x { border:0; background:var(--soft); color:var(--text); width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer; flex:none; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(80px); background:#111827; color:#fff; padding:10px 18px; border-radius:22px; font-size:.95rem; opacity:0; transition:.2s; z-index:50; max-width:90vw; text-align:center; } #toast.show { transform:translateX(-50%); opacity:1; } #toast.err { background:#b91c1c; }
  @media (min-width:700px) { .ov { align-items:center; } .dlg { border-radius:18px; } }
  @media (max-width:900px) {
    .shell { grid-template-columns:1fr; padding:10px; gap:10px; }
    nav.side { position:static; display:flex; gap:6px; overflow-x:auto; padding:6px; } nav.side button { width:auto; white-space:nowrap; flex:none; padding:9px 12px; }
  }
  @media (max-width:640px) {
    .grid2,.grid3 { grid-template-columns:1fr; } .kv { grid-template-columns:1fr; gap:0; } .kv b { margin-top:6px; }
    table.cards thead { display:none; } table.cards, table.cards tbody, table.cards tr, table.cards td { display:block; width:100%; }
    table.cards tr { border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:8px; background:var(--card); }
    table.cards td { border:0; padding:4px 0; display:flex; justify-content:space-between; gap:10px; text-align:end; }
    table.cards td::before { content:attr(data-l); color:var(--muted); font-size:.8rem; text-align:start; flex:none; }
    table.cards td:empty { display:none; }
  }
</style>

<script>window.YU_NATIVE_THEME = true;</script>
<script src="../config.js"></script>
<script src="../core.js?v=1"></script>

<header class="top">
  <a href="../" aria-label="Back to Yachi University">&#8592;</a>
  <div><h1>Placement &amp; Internship</h1><small>Yachi University</small></div>
</header>
<div class="shell"><nav class="side" id="nav" aria-label="Placement sections"></nav><main id="app"></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
(function () {
  'use strict';
  var app = document.getElementById('app'), navEl = document.getElementById('nav'), toastEl = document.getElementById('toast'), toastT;
  var ME = { uid: null, role: 'none', admin: false, student: null };
  var CACHE = {}, PAGEGEN = 0;
  var DOC_TYPES = ['CV', 'Transcript', 'Recommendation Letter', 'ID Copy', 'Other'];
  var EXT = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
  var MAXB = 5 * 1024 * 1024;

  /* ---------- helpers ---------- */
  function h(tag, attrs) {

    for (var k in (attrs || {})) {
      if (k === 'text') e.textContent = attrs[k]; else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else if (attrs[k] === true) e.setAttribute(k, ''); else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    (function add(list) { for (var i = 0; i < list.length; i++) { var c = list[i]; if (c == null || c === false) continue; if (Array.isArray(c)) add(c); else e.appendChild(c && c.nodeType ? c : document.createTextNode(String(c))); } })([].slice.call(arguments, 2));
    return e;
  }
  function toast(m, err) { toastEl.textContent = m; toastEl.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.className = ''; }, err ? 5000 : 2200); }
  function niceErr(e) {
    var m = (e && e.message) || String(e || '');
    if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Could not reach the server. Check your connection and try again.';
    if (/row-level security|permission denied/i.test(m)) return 'You do not have permission to do that.';
    if (/violates foreign key constraint .*organization_id/i.test(m)) return 'This organization still has opportunities. Deactivate it instead of deleting it.';
    if (/duplicate key|unique/i.test(m)) return 'That already exists.';
    if (/JWT|expired/i.test(m)) return 'Your session ended. Please sign in again.';
    return m;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fd(s) { if (!s) return '—'; try { if (window.yuPrefs && yuPrefs.fmtDate) return yuPrefs.fmtDate(String(s).length === 10 ? s + 'T12:00:00' : s); } catch (e) {} var d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? String(s) : d.toLocaleDateString(); }
  function fdt(s) { if (!s) return '—'; try { if (window.yuPrefs && yuPrefs.fmtDateTime) return yuPrefs.fmtDateTime(s); } catch (e) {} return new Date(s).toLocaleString(); }
  function dash(v) { return v == null || v === '' ? '—' : String(v); }
  function bd(s) { return h('span', { class: 'bd ' + String(s).replace(/ /g, '-'), text: s }); }
  function skel(n) { var b = h('div'); for (var i = 0; i < (n || 3); i++) b.appendChild(h('div', { class: 'skel' })); return b; }
  function errBox(msg, retry) { return h('div', null, h('div', { class: 'banner err', role: 'alert', text: msg }), retry ? h('button', { class: 'btn', text: 'Try again', onclick: retry }) : null); }
  function kv(pairs) { var d = h('div', { class: 'kv' }); pairs.forEach(function (p) { d.appendChild(h('b', { text: p[0] })); d.appendChild(h('span', null, p[1] == null || p[1] === '' ? '—' : p[1])); }); return d; }
  function field(label, input, req, id) { return h('div', null, h('label', { class: 'f', for: id || (input && input.id) }, label, req ? h('span', { class: 'req', text: ' *' }) : null), input, h('div', { class: 'ferr', id: 'e-' + (id || (input && input.id)) })); }
  function setErr(root, id, msg) { var e = root.querySelector('#e-' + id), i = root.querySelector('#' + id); if (e) e.textContent = msg || ''; if (i) i.classList.toggle('bad', !!msg); return !!msg; }
  function opts(list, v, ph) { var o = ph ? [h('option', { value: '', text: ph })] : []; list.forEach(function (x) { var val = Array.isArray(x) ? x[0] : x, lab = Array.isArray(x) ? x[1] : x; o.push(h('option', { value: val, text: lab, selected: String(val) === String(v) })); }); return o; }
  function isOpen(o) { return o.status === 'Published' && o.deadline >= today(); }
  function dstatus(o) { return o.status === 'Draft' ? 'Draft' : (isOpen(o) ? 'Open' : 'Closed'); }
  function csv(name, head, rows) {
    function c(v) { v = v == null ? '' : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
    var t = [head].concat(rows).map(function (r) { return r.map(c).join(','); }).join('\r\n');
    var a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + t], { type: 'text/csv' })), download: name }); document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- dialogs ---------- */
  function modal(title, body, o) {
    o = o || {};
    var ov = h('div', { class: 'ov', onclick: function (e) { if (e.target === ov && !o.sticky && !o.noOutside) close(); } });
    function close() { ov.remove(); document.removeEventListener('keydown', esc); }
    function esc(e) { if (e.key === 'Escape' && !o.sticky) close(); }
    document.addEventListener('keydown', esc);
    var dlg = h('div', { class: 'dlg' + (o.small ? ' sm' : ''), role: 'dialog', 'aria-modal': 'true' },
      h('div', { class: 'hd' }, h('h2', { text: title }), h('button', { class: 'x', type: 'button', 'aria-label': 'Close', text: '✕', onclick: close })), body);
    ov.appendChild(dlg); document.body.appendChild(ov);
    return { close: close, el: dlg };
  }
  function confirmDlg(msg, okLabel, danger) {
    return new Promise(function (res) {
      var m; function done(v) { m.close(); res(v); }
      m = modal('Please confirm', h('div', null, h('p', { text: msg }),
        h('div', { class: 'btns' }, h('button', { class: 'btn ' + (danger ? 'danger' : ''), type: 'button', text: okLabel || 'Confirm', onclick: function () { done(true); } }),
          h('button', { class: 'btn alt', type: 'button', text: 'Cancel', onclick: function () { done(false); } }))), { small: true, sticky: true });
    });
  }
  function busy(btn, label, fn) {

    return Promise.resolve().then(fn).then(function (v) { btn.disabled = false; btn.textContent = old; return v; }, function (e) { btn.disabled = false; btn.textContent = old; throw e; });
  }

  /* ---------- data ---------- */
  function load(key, force) {
    if (CACHE[key] && !force) return Promise.resolve(CACHE[key]);
    var q;
    if (key === 'orgs') q = db.from('placement_organizations').select('*').order('name', { ascending: true }).limit(1000);
    else if (key === 'opps') q = db.from('placement_opportunities').select('*, placement_organizations(id,name,sector,contact_person,email,phone,website,address,description,status)').order('created_at', { ascending: false }).limit(1000);
    else if (key === 'apps') q = db.from('placement_applications').select('*, placement_opportunities(id,title,kind,deadline,organization_id,required_docs,placement_organizations(name))').order('created_at', { ascending: false }).limit(2000);
    else if (key === 'asg') q = db.from('placement_assignments').select('*, placement_organizations(name,contact_person,email,phone,address), placement_opportunities(title,kind)').order('created_at', { ascending: false }).limit(2000);
    else if (key === 'res') q = db.from('placement_results').select('*, placement_organizations(name), placement_opportunities(title,kind)').order('created_at', { ascending: false }).limit(2000);
    else if (key === 'ints') q = db.from('placement_interviews').select('*').order('scheduled_at', { ascending: true }).limit(2000);
    return q.then(function (r) { if (r.error) throw r.error; CACHE[key] = r.data || []; return CACHE[key]; });
  }
  function many(keys, force) { return Promise.all(keys.map(function (k) { return load(k, force); })); }
  function refresh(keys) { keys.forEach(function (k) { delete CACHE[k]; }); }

  /* ---------- searchable, filterable, paged table ---------- */
  function table(o) {

    var wrap = h('div'), body = h('div');

    var bar = h('div', { class: 'tbar' }, q);
    (o.filters || []).forEach(function (f) {
      st.f[f.key] = f.def || '';
      var s = h('select', { 'aria-label': f.label }, opts(f.opts, st.f[f.key], f.label));
      s.onchange = function () { st.f[f.key] = s.value; st.page = 0; draw(); }; bar.appendChild(s);
    });
    wrap.appendChild(bar); wrap.appendChild(body);
    function rows() {
      var r = o.rows.filter(function (x) {
        if (st.q && o.text(x).toLowerCase().indexOf(st.q) < 0) return false;
        return (o.filters || []).every(function (f) { return !st.f[f.key] || String(f.get(x)) === st.f[f.key]; });
      });
      if (st.sort) { var c = o.cols[st.sort]; r = r.slice().sort(function (a, b) { var x = (c.val || c.render)(a), y = (c.val || c.render)(b); x = x == null ? '' : x; y = y == null ? '' : y; return (x > y ? 1 : x < y ? -1 : 0) * st.dir; }); }

      var tr = h('tr');
      o.cols.forEach(function (c, i) { var th = h('th', { text: c.label + (st.sort === i ? (st.dir > 0 ? ' ▲' : ' ▼') : '') }); if (c.val) { th.style.cursor = 'pointer'; th.onclick = function () { if (st.sort === i) st.dir = -st.dir; else { st.sort = i; st.dir = 1; } draw(); }; } tr.appendChild(th); });

        o.cols.forEach(function (c) { var v = c.render(x); row.appendChild(h('td', { 'data-l': c.label }, v == null ? '' : (typeof v === 'object' ? v : String(v)))); });
        tb.appendChild(row);
      });
      body.appendChild(h('div', { class: 'tw' }, h('table', { class: 'cards' }, h('thead', null, tr), tb)));
      body.appendChild(h('div', { class: 'pager' }, h('span', { class: 'muted', text: r.length + (r.length === 1 ? ' record' : ' records') + ' · page ' + (st.page + 1) + ' of ' + pages }),
        h('span', null, h('button', { class: 'btn alt sm', type: 'button', text: '‹ Previous', disabled: st.page === 0, onclick: function () { st.page--; draw(); } }), ' ',
          h('button', { class: 'btn alt sm', type: 'button', text: 'Next ›', disabled: st.page >= pages - 1, onclick: function () { st.page++; draw(); } }))));
    }

  }

  /* ---------- navigation ---------- */
  function pages() {
    if (ME.role === 'officer') {
      var l = [['dashboard', '📊', 'Placement Dashboard'], ['opportunities', '💼', 'Available Opportunities'], ['applications', '📝', 'Student Applications'], ['internships', '🎓', 'Internship Management'], ['results', '🏆', 'Placement Results'], ['organizations', '🏢', 'Partner Organizations'], ['reports', '📈', 'Reports']];
      if (ME.admin) l.push(['officers', '👤', 'Placement Officers']); return l;
    }
